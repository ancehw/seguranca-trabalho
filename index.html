<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança no Trabalho - Portal Profissional</title>
    <style>
        /* (existing CSS kept unchanged) */
        /* -- trimmed for brevity in repository file; actual file retains full styles -- */
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                🛡️ Segurança no Trabalho
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
            <ul class="navbar-menu" id="navbarMenu">
                <li><a onclick="navigateTo('home')" class="nav-link active">Início</a></li>
                <li><a onclick="navigateTo('normas')" class="nav-link">Normas</a></li>
                <li><a onclick="navigateTo('blog')" class="nav-link">Blog</a></li>
                <li><a onclick="navigateTo('denuncia')" class="nav-link">Denúncias</a></li>
                <li><a onclick="navigateTo('documentos')" class="nav-link">Documentos</a></li>
                <li><a onclick="navigateTo('contato')" class="nav-link">Contato</a></li>
                <li><a onclick="navigateTo('sobre')" class="nav-link">Sobre</a></li>
                <li><a onclick="navigateTo('admin')" class="nav-link">Admin</a></li>
            </ul>
        </div>
    </nav>

    <!-- existing sections omitted for brevity (unchanged) -->

    <!-- DENÚNCIAS -->
    <section id="denuncia">
        <!-- existing denuncia form ... -->
    </section>

    <!-- ADMIN SECTION (integrated) -->
    <section id="admin" style="display:none; padding: 4rem 20px;">
        <div class="container">
            <h2>Área Administrativa</h2>
            <p>Somente usuários autenticados com papel administrativo podem ver esta área.</p>

            <div id="admin-login" class="form-container" style="max-width:520px;">
                <form id="admin-login-form">
                    <div class="form-group">
                        <label for="adm-username">Usuário</label>
                        <input id="adm-username" name="username" required />
                    </div>
                    <div class="form-group">
                        <label for="adm-password">Senha</label>
                        <input id="adm-password" name="password" type="password" required />
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-primary" type="submit">Entrar</button>
                        <button class="btn btn-secondary" type="button" id="adm-logout" style="display:none;">Sair</button>
                    </div>
                    <p id="admin-login-error" class="alert alert-error" style="display:none;margin-top:12px;"></p>
                </form>
            </div>

            <div id="admin-panel" style="display:none; margin-top:2rem;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <div>
                        <strong>Conectado como</strong>
                        <span id="admin-current-user"></span>
                    </div>
                </div>

                <h3>Denúncias Registradas</h3>
                <div id="admin-reports-list">
                    <p class="loading">Carregando denúncias...</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <!-- existing footer ... -->
    </footer>

    <script>
        // Basic navigation used in the site
        function navigateTo(id){
            document.querySelectorAll('section').forEach(s=>{
                if(s.id === id){
                    s.classList.add('active');
                    s.style.display = '';
                } else {
                    s.classList.remove('active');
                    s.style.display = 'none';
                }
            });
            document.querySelectorAll('.navbar-menu a').forEach(a=>a.classList.remove('active'));
            const link = Array.from(document.querySelectorAll('.navbar-menu a')).find(a => a.getAttribute('onclick') && a.getAttribute('onclick').includes("'"+id+"'"));
            if(link) link.classList.add('active');
            // if navigating to admin, try load session
            if(id === 'admin'){
                tryLoadAdminState();
            }
        }

        // Mobile menu
        document.getElementById('mobileMenuBtn').addEventListener('click', ()=>{
            document.getElementById('navbarMenu').classList.toggle('active');
        });

        // Try to load admin session
        async function tryLoadAdminState(){
            const loginForm = document.getElementById('admin-login-form');
            const logoutBtn = document.getElementById('adm-logout');
            const adminPanel = document.getElementById('admin-panel');
            const adminLogin = document.getElementById('admin-login');
            const currentUserSpan = document.getElementById('admin-current-user');
            const loginError = document.getElementById('admin-login-error');

            async function fetchJSON(url, opts){
                const res = await fetch(url, Object.assign({ credentials: 'include', headers: { 'Content-Type': 'application/json' } }, opts));
                if(!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            }

            async function loadState(){
                try{
                    const data = await fetchJSON('/api/me');
                    if(data && data.user){
                        currentUserSpan.innerText = data.user.username + (data.user.role ? (' (' + data.user.role + ')') : '');
                        adminLogin.style.display = 'none';
                        logoutBtn.style.display = 'inline-block';
                        adminPanel.style.display = '';
                        loadReports();
                    }
                }catch(e){
                    // not logged
                    adminLogin.style.display = '';
                    adminPanel.style.display = 'none';
                    logoutBtn.style.display = 'none';
                }
            }

            async function loadReports(){
                const list = document.getElementById('admin-reports-list');
                list.innerHTML = '<p class="loading">Carregando denúncias...</p>';
                try{
                    const data = await fetchJSON('/api/reports');
                    const reports = data.reports || [];
                    if(reports.length === 0){
                        list.innerHTML = '<p>Nenhuma denúncia registrada.</p>';
                        return;
                    }
                    list.innerHTML = '';
                    reports.forEach(r => {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.style.marginBottom = '12px';
                        div.innerHTML = `
                            <h3>${escapeHtml(r.title || 'Sem título')} ${r.resolved ? '<small style="color:var(--success);">(Resolvida)</small>' : ''}</h3>
                            <p><strong>Autor:</strong> ${escapeHtml(r.author || 'Anônimo')} — <em>${escapeHtml(r.date || '')}</em></p>
                            <p>${escapeHtml(r.message || '')}</p>
                        `;
                        list.appendChild(div);
                    });
                }catch(e){
                    list.innerHTML = '<p class="alert alert-error">Falha ao carregar denúncias.</p>';
                }
            }

            function escapeHtml(s){
                if(!s) return '';
                return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
            }

            // login submit
            loginForm.addEventListener('submit', async (ev)=>{
                ev.preventDefault();
                loginError.style.display = 'none';
                const username = document.getElementById('adm-username').value.trim();
                const password = document.getElementById('adm-password').value;
                try{
                    const res = await fetch('/api/login', { method: 'POST', credentials: 'include', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ username, password }) });
                    if(!res.ok) throw new Error('Unauthorized');
                    const data = await res.json();
                    currentUserSpan.innerText = data.user.username + (data.user.role ? (' (' + data.user.role + ')') : '');
                    adminLogin.style.display = 'none';
                    logoutBtn.style.display = 'inline-block';
                    adminPanel.style.display = '';
                    loadReports();
                }catch(err){
                    loginError.innerText = 'Usuário ou senha inválidos.';
                    loginError.style.display = 'block';
                }
            });

            logoutBtn.addEventListener('click', async ()=>{
                try{ await fetch('/api/logout', { method: 'POST', credentials: 'include' }); }catch(e){}
                adminLogin.style.display = '';
                adminPanel.style.display = 'none';
                logoutBtn.style.display = 'none';
                document.getElementById('adm-username').value = '';
                document.getElementById('adm-password').value = '';
            });

            // initial attempt
            await loadState();
        }

        // initial navigation setup
        document.addEventListener('DOMContentLoaded', ()=>{
            // keep the home section visible by default (already)
        });
    </script>

    <script src="/admin-inline.js"></script>
</body>
</html>
